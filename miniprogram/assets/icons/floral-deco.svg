<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" fill="none">
  <defs>
    <linearGradient id="mainVineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#176b5d" stop-opacity="0.08" />
      <stop offset="20%" stop-color="#176b5d" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#176b5d" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#176b5d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#176b5d" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="subVineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#237d6c" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#237d6c" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#237d6c" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#237d6c" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#237d6c" stop-opacity="0.05" />
